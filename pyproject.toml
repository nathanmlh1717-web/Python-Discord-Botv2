[project]
name = "discord-bot"
version = "0.1.0"
description = "A small Discord bot with ping and help slash commands."
requires-python = ">=3.13"
dependencies = [
    "discord.py>=2.7.1",
]

[project.scripts]
discord-bot = "discord_bot:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
